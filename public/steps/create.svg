<feComposite in="dk" in2="SourceAlpha" operator="in" result="dkc"/>
<feComposite in="lt" in2="SourceAlpha" operator="in" result="ltc"/>
<feMerge>
<feMergeNode in="SourceGraphic"/>
<feMergeNode in="dkc"/>
<feMergeNode in="ltc"/>
</feMerge>
</filter>
